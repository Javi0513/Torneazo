<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@1,700;1,800&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#070807;--card:#121512;--line:#232923;--tx:#F2F5EF;--mut:#9AA595;--ac:#9BEA1C;--ok:#9BEA1C;--gold:#E9ECE6;--ink:#0A0B0A}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 Inter,system-ui,sans-serif;padding-bottom:90px}
.wrap{max-width:760px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
h1,h2,.brand{font-family:'Exo 2',Inter,sans-serif;font-style:italic;font-weight:800}h1{font-size:24px;margin:0;line-height:1}h2{font-size:19px;margin:0 0 10px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:56px;height:42px;object-fit:contain}.brand small{display:block;font:500 11px Inter,sans-serif;font-style:normal;color:var(--mut);margin-top:3px}.brand b{color:var(--ac)}h3{font-size:15px;margin:14px 0 6px;color:var(--mut)}
.badge{font-size:12px;padding:3px 8px;border-radius:99px;background:var(--line);color:var(--mut)}
.badge.pro{background:var(--ac);color:var(--ink);font-weight:700}
.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:12px}
.tab{flex:1;min-width:90px;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--mut);text-align:center;cursor:pointer;font-size:14px}
.tab.on{background:var(--ac);color:var(--ink);font-weight:700;border-color:var(--ac)}.tab.off{opacity:.4;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:110px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
button{padding:11px 14px;border:0;border-radius:10px;background:var(--ac);color:var(--ink);font:inherit;font-family:'Exo 2',Inter,sans-serif;font-style:italic;font-weight:800;letter-spacing:.3px;cursor:pointer}
button.sec{background:var(--line);color:var(--tx)}button.gold{background:var(--gold);color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 11px;border-radius:99px;border:1px solid var(--line);background:var(--bg);color:var(--mut);cursor:pointer;font-size:14px}
.chip.on{background:var(--ac);color:var(--ink);font-weight:600;border-color:var(--ac)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--line)}
th:nth-child(2),td:nth-child(2){text-align:left}th{color:var(--mut);font-weight:500}
tr.q td{color:var(--ok);font-weight:600}
.match{display:grid;grid-template-columns:1fr 48px 12px 48px 1fr;gap:6px;align-items:center;margin:6px 0;font-size:14px}
.match input{padding:6px;text-align:center}.match .a{text-align:right}
.small{font-size:12px;color:var(--mut)}
.round{margin-bottom:6px}
.ko{padding:8px 0;border-bottom:1px solid var(--line)}
.champ{text-align:center;font-size:20px;padding:18px;background:#0F130E;border-radius:14px;border:2px solid var(--ac);font-family:'Exo 2',Inter,sans-serif;font-style:italic}
.ad{position:fixed;left:0;right:0;bottom:0;background:#fff;color:#333;text-align:center;padding:10px;font-size:13px;border-top:3px solid var(--ac)}
.ad b{color:#d33}.ad span{cursor:pointer;text-decoration:underline;color:#2B6A00;margin-left:8px}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal.on{display:flex}.modal .card{max-width:420px}
ul{padding-left:18px;margin:6px 0}

/* ===== Animaciones ===== */
:root{--ease:cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 #9BEA1C55}50%{box-shadow:0 0 0 9px #9BEA1C00}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes champ{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.06)}100%{transform:none;opacity:1}}
@keyframes shine{from{background-position:-200% 0}to{background-position:200% 0}}
.brand img{animation:floaty 4s ease-in-out infinite;filter:drop-shadow(0 0 8px #9BEA1C55)}
.anim .card,.anim .champ,.anim .tabs{animation:rise .5s var(--ease) both}
.anim .card:nth-of-type(1),.anim .champ{animation-delay:.04s}.anim .card:nth-of-type(2){animation-delay:.1s}
.anim .card:nth-of-type(3){animation-delay:.16s}.anim .card:nth-of-type(4){animation-delay:.22s}
.anim .card:nth-of-type(n+5){animation-delay:.28s}
.anim .champ{animation:champ .8s var(--ease) both}
button{position:relative;overflow:hidden;transition:transform .15s var(--ease),box-shadow .2s,filter .2s}
button:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.08);box-shadow:0 8px 20px #9BEA1C33}
button:active:not(:disabled){transform:translateY(0) scale(.96)}
button:not(.sec):not(.gold):not(.acct)::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,#ffffff66 50%,transparent 70%);background-size:200% 100%;opacity:0}
button:not(.sec):not(.gold):not(.acct):hover::after{opacity:1;animation:shine .9s linear}
.card>.row>button:first-child:not(.sec){animation:glow 2.4s ease-in-out infinite}
.chip,.tab{transition:background .2s,color .2s,border-color .2s,transform .15s var(--ease)}
.chip:hover,.tab:not(.off):hover{transform:translateY(-2px);border-color:var(--ac)}
.chip:active{transform:scale(.94)}
input,select,textarea{transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px #9BEA1C33}
.match input:focus{transform:scale(1.08)}
tr{transition:background .2s}tr:hover{background:#9BEA1C0d}
.modal.on{animation:fade .2s both}.modal.on .card{animation:pop .3s var(--ease) both}
.ad{animation:rise .6s var(--ease) .4s both}
.acct{background:var(--card);color:var(--tx);border:1px solid var(--line);font:600 13px Inter,sans-serif;font-style:normal;padding:6px 12px;border-radius:99px;letter-spacing:0}
.hdr-r{display:flex;align-items:center;gap:8px}
.modal .card{max-height:92vh;overflow:auto}
.err{color:#ff8a80;font-size:13px;min-height:18px;margin:6px 0 0}
.ok{color:var(--ac);font-size:13px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="modal" id="modal"><div class="card" id="modalBody"></div></div>
<!--REPO-ONLY-START--><script src="config.js"></script><script src="supabase.js"></script><!--REPO-ONLY-END-->
<script>
const MODES={1:'Individual',2:'Dúo',3:'Trío',4:'Escuadrón (4)',5:'Equipos de 5'};
const FREE={maxPlayers:32,modes:[1,2]};
const FORMATS={grupos:'Grupos + eliminatoria',liguilla:'Liguilla (todos contra todos)',eliminacion:'Eliminación directa'};
const def=()=>({premium:false,step:0,name:'Torneo del viernes',game:'FIFA',size:1,format:'grupos',groups:2,
  players:'',teams:[],groupsList:[],matches:[],ko:null,pairing:'dentro',rivals:2,nextN:2,nextExtra:0,nextKind:'ko',liga:null,koTop:2});
let S=def();
try{const s=JSON.parse(localStorage.getItem('torneazo')||'null');if(s)S=Object.assign(def(),s)}catch(e){}
const save=()=>{try{localStorage.setItem('torneazo',JSON.stringify(S))}catch(e){}if(typeof cloudSave=='function')cloudSave()};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const names=()=>S.players.split(/\n|,/).map(x=>x.trim()).filter(Boolean);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const team=id=>S.teams[id];

function paywall(msg){
  $('modalBody').innerHTML=`<h2>Premium</h2><p>${msg}</p>
  <ul><li>Sin anuncios</li><li>Hasta 128 participantes</li><li>Todos los modos: trío, escuadrón, equipos de 5</li><li>Compartir resultados con un toque</li></ul>
  <p><b>2,99 €/mes</b> · <b>19,99 €/año</b> · Pase de un torneo <b>1,99 €</b></p><p class="small">${CFG.url?(CFG.pro?'Pago seguro con Stripe.':'El pago online se activará en breve.'):'Demostración: no se cobra nada.'}</p>
  <div class="row">${CFG.url?(CFG.pro?'<button class="gold" onclick="buyPremium()">Activar Premium</button>':''):'<button class="gold" onclick="setPremium(true)">Activar Premium (demo)</button>'}<button class="sec" onclick="closeModal()">Ahora no</button></div>`;
  $('modal').classList.add('on');
}
const $=s=>document.getElementById(s);
function closeModal(){$('modal').classList.remove('on')}
function buyPremium(){
  if(!user){authMode='register';authForm();return}
  const u=CFG.pro+(CFG.pro.indexOf('?')<0?'?':'&')+'client_reference_id='+encodeURIComponent(user.id)+'&prefilled_email='+encodeURIComponent(user.email);
  window.open(u,'_blank','noopener');
}
function setPremium(v){if(CFG.url)return;S.premium=v;closeModal();save();render()}
function set(k,v){S[k]=v;save();render()}
function setText(v){S.players=v;save();$('count').textContent=names().length+' participantes'}
function pickMode(n){if(!S.premium&&!FREE.modes.includes(n))return paywall('Este modo de juego es de la versión Premium.');set('size',n)}

function draw(){
  const list=names(),size=+S.size;
  if(!S.premium&&list.length>FREE.maxPlayers)return paywall(`La versión gratuita permite hasta ${FREE.maxPlayers} participantes.`);
  if(list.length>128)return alert('Máximo 128 participantes.');
  if(list.length%size)return alert(`Con modo "${MODES[size]}" necesitas un número de jugadores múltiplo de ${size}. Ahora hay ${list.length}.`);
  const ps=shuffle(list),teams=[];
  for(let i=0;i<ps.length;i+=size){const m=ps.slice(i,i+size);
    teams.push({id:teams.length,members:m,name:size==1?m[0]:size==2?m.join(' & '):'Equipo '+(teams.length+1)})}
  if(teams.length<2)return alert('Hacen falta al menos 2 participantes o equipos.');
  S.teams=teams;S.drawn=(S.drawn||0)+1;S.matches=[];S.ko=null;S.groupsList=[];
  if(S.format=='eliminacion'){S.ko=buildKO(teams.map(t=>t.id));S.step=3}
  else{
    const g=S.format=='liguilla'?1:Math.max(1,Math.min(+S.groups,Math.floor(teams.length/2)));
    S.groupsList=Array.from({length:g},()=>[]);
    teams.forEach((t,i)=>S.groupsList[i%g].push(t.id));
    S.liga=null;
    if(S.pairing=='cruzado'&&g>1){
      for(let x=0;x<g;x++)for(let y=x+1;y<g;y++){const A=S.groupsList[x],B=S.groupsList[y],k=Math.min(+S.rivals,B.length);
        A.forEach((a,i)=>{for(let t=0;t<k;t++)S.matches.push({g:x,h:y,a,b:B[(i+t)%B.length],sa:null,sb:null})})}
    }else S.groupsList.forEach((ids,gi)=>{for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++)S.matches.push({g:gi,h:gi,a:ids[i],b:ids[j],sa:null,sb:null})});
    S.step=1;
  }
  save();render();
}

function calc(ids,matches){
  const rows=ids.map(id=>({id,pj:0,g:0,e:0,p:0,gf:0,gc:0,pts:0}));
  const by=Object.fromEntries(rows.map(r=>[r.id,r]));
  matches.filter(m=>m.sa!=null&&m.sb!=null).forEach(m=>{
    const A=by[m.a],B=by[m.b],w=A&&B?0:1;
    const up=(X,gf,gc)=>{if(!X)return;X.pj++;X.gf+=gf;X.gc+=gc;if(gf>gc){X.g++;X.pts+=3}else if(gf<gc)X.p++;else{X.e++;X.pts++}};
    up(A,m.sa,m.sb);up(B,m.sb,m.sa)});
  return rows.sort((x,y)=>y.pts-x.pts||(y.gf-y.gc)-(x.gf-x.gc)||y.gf-x.gf);
}
const standings=gi=>calc(S.groupsList[gi],S.matches);
function setScore(i,side,v){const m=S.matches[i];m[side]=v===''?null:Math.max(0,parseInt(v)||0);save();render()}
const groupsDone=()=>S.matches.length&&S.matches.every(m=>m.sa!=null&&m.sb!=null);

function buildKO(seeds){
  let size=2;while(size<seeds.length)size*=2;
  let order=[1];while(order.length<size){const n=order.length*2;order=order.flatMap(s=>[s,n+1-s])}
  const rounds=[];
  rounds.push(Array.from({length:size/2},(_,i)=>{
    const a=seeds[order[2*i]-1],b=seeds[order[2*i+1]-1];
    return {a:a??null,b:b??null,sa:null,sb:null,bye:a==null||b==null}}));
  for(let n=size/4;n>=1;n/=2)rounds.push(Array.from({length:n},()=>({a:null,b:null,sa:null,sb:null,bye:false})));
  return rounds;
}
function winner(m){
  if(m.bye)return m.a??m.b;
  if(m.a==null||m.b==null||m.sa==null||m.sb==null||m.sa===m.sb)return null;
  return m.sa>m.sb?m.a:m.b;
}
function resolveKO(){
  S.ko.forEach((r,ri)=>{if(ri>0)r.forEach((m,i)=>{const na=winner(S.ko[ri-1][2*i]),nb=winner(S.ko[ri-1][2*i+1]);
    if(m.a!==na||m.b!==nb){m.a=na;m.b=nb;m.sa=m.sb=null}})});
}
function qualifiers(){
  const q=[],rest=[];
  S.groupsList.forEach((_,gi)=>standings(gi).forEach((r,pos)=>{const o={id:r.id,pos,pts:r.pts,d:r.gf-r.gc,gf:r.gf};(pos<S.nextN?q:rest).push(o)}));
  const cmp=(x,y)=>x.pts-y.pts||x.d-y.d||x.gf-y.gf;
  q.sort((x,y)=>x.pos-y.pos||cmp(y,x));rest.sort((x,y)=>cmp(y,x));
  return q.concat(rest.slice(0,+S.nextExtra)).map(x=>x.id);
}
function genNext(){
  const ids=qualifiers();
  if(ids.length<2)return notice('Tienen que pasar al menos 2 equipos.');
  S.ko=null;S.liga=null;
  if(S.nextKind=='ko')S.ko=buildKO(ids);
  else{const ms=[];for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++)ms.push({a:ids[i],b:ids[j],sa:null,sb:null});S.liga={ids,matches:ms}}
  S.step=3;save();render();
}
function ligaToKO(){const r=calc(S.liga.ids,S.liga.matches).slice(0,+S.koTop).map(x=>x.id);if(r.length<2)return notice('Hacen falta al menos 2 equipos.');S.ko=buildKO(r);save();render()}
function setLiga(i,side,v){const m=S.liga.matches[i];m[side]=v===''?null:Math.max(0,parseInt(v)||0);save();render()}
function setKO(r,i,side,v){const m=S.ko[r][i];m[side]=v===''?null:Math.max(0,parseInt(v)||0);save();render()}
function roundName(ri,total){const left=total-ri;return left==1?'Final':left==2?'Semifinales':left==3?'Cuartos de final':'Ronda '+(ri+1)}

function share(){
  if(!S.premium)return paywall('Compartir resultados es una función Premium.');
  let t=` ${S.name} (${S.game})\n`;
  S.groupsList.forEach((_,gi)=>{t+=`\nGrupo ${String.fromCharCode(65+gi)}\n`;standings(gi).forEach((r,i)=>t+=`${i+1}. ${team(r.id).name} - ${r.pts} pts\n`)});
  if(S.ko){const f=S.ko[S.ko.length-1][0],w=winner(f);if(w!=null)t+=`\nCampeón: ${team(w).name}`}
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>alert('Resultados copiados. ¡Pégalos en WhatsApp!'),()=>prompt('Copia los resultados:',t));
}
function reset(){if(confirm('¿Empezar un torneo nuevo? Se borra el actual.')){const p=S.premium;S=def();S.premium=p;save();render()}}

let lastKey=null,firstRender=true;
function render(){
  const tabs=['1. Configurar','2. Sorteo','3. Partidos','4. Fase final'];

function viewSetup(){
  return `<div class="card"><h2>Datos del torneo</h2>
  <div class="row"><div><label>Nombre</label><input value="${esc(S.name)}" onchange="S.name=this.value;save()"></div>
  <div><label>Juego</label><input value="${esc(S.game)}" onchange="S.game=this.value;save()"></div></div>
  <label>Modo de juego</label><div class="chips">${Object.entries(MODES).map(([n,l])=>`<div class="chip ${S.size==n?'on':''}" onclick="pickMode(${n})">${l}${!S.premium&&!FREE.modes.includes(+n)?' 🔒':''}</div>`).join('')}</div>
  <label>Formato</label><div class="chips">${Object.entries(FORMATS).map(([k,l])=>`<div class="chip ${S.format==k?'on':''}" onclick="set('format','${k}')">${l}</div>`).join('')}</div>
  ${S.format=='grupos'?`<label>Número de grupos</label><select onchange="set('groups',+this.value)">${[2,3,4,5,6,8].map(n=>`<option ${S.groups==n?'selected':''}>${n}</option>`).join('')}</select>
  <label>¿Contra quién juega cada uno en la fase de grupos?</label><div class="chips">
  <div class="chip ${S.pairing=='dentro'?'on':''}" onclick="set('pairing','dentro')">Contra los de su grupo</div>
  <div class="chip ${S.pairing=='cruzado'?'on':''}" onclick="set('pairing','cruzado')">Contra otros grupos (cruzado)</div></div>
  ${S.pairing=='cruzado'?`<label>Rivales de cada grupo (por jugador)</label><select onchange="set('rivals',+this.value)">${[1,2,3,4].map(n=>`<option ${S.rivals==n?'selected':''}>${n}</option>`).join('')}</select><p class="small">Cada jugador se enfrenta a ${S.rivals} rival(es) de cada uno de los otros grupos, nunca a los de su propio grupo.</p>`:''}`:''}</div>
  <div class="card"><h2>Participantes</h2><p class="small">Uno por línea (o separados por comas). ${S.premium?'Hasta 128.':`Gratis: hasta ${FREE.maxPlayers}.`} ${S.size>1?`Con ${MODES[S.size]} se forman equipos al azar de ${S.size}.`:''}</p>
  <textarea oninput="setText(this.value)" placeholder="Baruc&#10;Javi&#10;Willy&#10;...">${esc(S.players)}</textarea>
  <p class="small" id="count">${names().length} participantes</p>
  <div class="row"><button onclick="draw()">Hacer sorteo</button><button class="sec" onclick="reset()">Nuevo torneo</button></div></div>`;
}
function viewDraw(){
  return `<div class="card"><h2>Resultado del sorteo</h2>`+S.groupsList.map((ids,gi)=>`<h3>${S.format=='liguilla'?'Liguilla':'Grupo '+String.fromCharCode(65+gi)}</h3>
  ${ids.map(id=>`<div>• <b>${esc(team(id).name)}</b>${S.size>2?` <span class="small">${team(id).members.map(esc).join(', ')}</span>`:''}</div>`).join('')}`).join('')+
  `<div class="row" style="margin-top:12px"><button class="sec" onclick="draw()">Repetir sorteo</button><button onclick="set('step',2)">Ver partidos →</button></div></div>`;
}
const gl=gi=>String.fromCharCode(65+gi);
function matchRow(m,fn){return `<div class="match"><span class="a">${esc(team(m.a).name)}</span>
  <input type="number" min="0" value="${m.sa??''}" onchange="${fn}('sa',this.value)"><span>-</span>
  <input type="number" min="0" value="${m.sb??''}" onchange="${fn}('sb',this.value)"><span>${esc(team(m.b).name)}</span></div>`}
function table(rows,nq){return `<table><tr><th>#</th><th>Equipo</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>DG</th><th>Pts</th></tr>
  ${rows.map((r,i)=>`<tr class="${i<nq?'q':''}"><td>${i+1}</td><td>${esc(team(r.id).name)}</td><td>${r.pj}</td><td>${r.g}</td><td>${r.e}</td><td>${r.p}</td><td>${r.gf-r.gc}</td><td><b>${r.pts}</b></td></tr>`).join('')}</table>`}
function viewMatches(){
  let h='';const cross=S.matches.some(m=>m.g!==m.h),nq=S.format=='grupos'?+S.nextN:0;
  S.groupsList.forEach((_,gi)=>{
    h+=`<div class="card"><h2>${S.format=='liguilla'?'Clasificación':'Grupo '+gl(gi)}</h2>${table(standings(gi),nq)}`;
    if(!cross)h+=`<h3>Partidos</h3>`+S.matches.map((m,i)=>m.g!=gi?'':matchRow(m,`((k,v)=>setScore(${i},k,v))`)).join('');
    h+=`</div>`});
  if(cross){
    for(let x=0;x<S.groupsList.length;x++)for(let y=x+1;y<S.groupsList.length;y++){
      const ms=S.matches.map((m,i)=>[m,i]).filter(([m])=>m.g==x&&m.h==y);
      h+=`<div class="card"><h2>Grupo ${gl(x)} vs Grupo ${gl(y)}</h2>`+ms.map(([m,i])=>matchRow(m,`((k,v)=>setScore(${i},k,v))`)).join('')+`</div>`}
  }
  if(S.format=='grupos'){
    const mx=Math.min(...S.groupsList.map(g=>g.length));
    h+=`<div class="card"><h2>Siguiente fase</h2>
    <div class="row"><div><label>Pasan los mejores de cada grupo</label><select onchange="S.nextN=+this.value;save();render()">${Array.from({length:mx},(_,i)=>i+1).map(n=>`<option ${S.nextN==n?'selected':''}>${n}</option>`).join('')}</select></div>
    <div><label>+ mejores del resto</label><select onchange="S.nextExtra=+this.value;save();render()">${[0,1,2,3,4,5,6].map(n=>`<option ${S.nextExtra==n?'selected':''}>${n}</option>`).join('')}</select></div></div>
    <label>Formato de la siguiente fase</label><div class="chips">
    <div class="chip ${S.nextKind=='ko'?'on':''}" onclick="set('nextKind','ko')">Eliminatoria</div>
    <div class="chip ${S.nextKind=='liga'?'on':''}" onclick="set('nextKind','liga')">Nuevo grupo (liguilla)</div></div>
    <p class="small">Se clasifican ${qualifiers().length} equipos (en verde, los mejores de cada grupo).</p>
    <button ${groupsDone()?'':'disabled style="opacity:.4"'} onclick="genNext()">Generar siguiente fase →</button></div>`;
  }else{const t=standings(0)[0];h+=groupsDone()?`<div class="champ">Campeón: <b>${esc(team(t.id).name)}</b></div>`:''}
  return h+`<div class="card"><button class="gold" onclick="share()">Compartir resultados${S.premium?'':' 🔒'}</button></div>`;
}
function viewLiga(){
  const L=S.liga,rows=calc(L.ids,L.matches),done=L.matches.every(m=>m.sa!=null&&m.sb!=null);
  return `<div class="card"><h2>Nuevo grupo (liguilla)</h2>${table(rows,S.ko?+S.koTop:0)}<h3>Partidos</h3>${L.matches.map((m,i)=>matchRow(m,`((k,v)=>setLiga(${i},k,v))`)).join('')}</div>
  <div class="card"><label>Pasan a la eliminatoria los mejores</label><select onchange="S.koTop=+this.value;save();render()">${[2,4,8,16].filter(n=>n<=L.ids.length).map(n=>`<option ${S.koTop==n?'selected':''}>${n}</option>`).join('')}</select><br><br>
  <button ${done?'':'disabled style="opacity:.4"'} onclick="ligaToKO()">Generar eliminatoria →</button></div>`;
}
function viewKO(){
  const pre=S.liga?viewLiga():'';
  if(!S.ko)return pre;
  resolveKO();save();
  const R=S.ko,n=R.length,nm=id=>id==null?'<span class="small">Por definir</span>':esc(team(id).name);
  const fin=winner(R[n-1][0]);
  let h=fin!=null?`<div class="champ">Campeón: <b>${esc(team(fin).name)}</b></div><br>`:'';
  R.forEach((r,ri)=>{h+=`<div class="card round"><h2>${roundName(ri,n)}</h2>`+r.map((m,i)=>m.bye?`<div class="ko">${nm(m.a??m.b)} <span class="small">· pasa directo</span></div>`:
    `<div class="ko"><div class="match"><span class="a">${nm(m.a)}</span>
    <input type="number" min="0" ${m.a==null||m.b==null?'disabled':''} value="${m.sa??''}" onchange="setKO(${ri},${i},'sa',this.value)"><span>-</span>
    <input type="number" min="0" ${m.a==null||m.b==null?'disabled':''} value="${m.sb??''}" onchange="setKO(${ri},${i},'sb',this.value)"><span>${nm(m.b)}</span></div>
    ${m.sa!=null&&m.sa===m.sb?'<div class="small" style="color:var(--gold)">Empate: en eliminatoria debe haber ganador (prórroga/penaltis).</div>':''}</div>`).join('')+`</div>`});
  return pre+h+`<div class="card"><button class="gold" onclick="share()">Compartir resultados${S.premium?'':' 🔒'}</button></div>`;
}

let sb=null,user=null,profile=null,authMode='login',authLock=0,saveT=null;
const okAv=a=>typeof a=='string'&&a.length<40000&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(a);
const avImg=(a,sz)=>okAv(a)?`<img src="${a}" alt="" style="width:${sz}px;height:${sz}px;border-radius:50%;object-fit:cover;vertical-align:middle;animation:none;filter:none">`:`<span style="display:inline-flex;width:${sz}px;height:${sz}px;border-radius:50%;background:var(--line);align-items:center;justify-content:center;font-weight:800;color:var(--ac);font-size:${sz*.5|0}px;vertical-align:middle">${esc((((profile&&profile.display_name)||(user&&user.email)||'?')[0]||'?').toUpperCase())}</span>`;
const acctLabel=()=>user?avImg(profile&&profile.avatar,22)+' '+esc((profile&&profile.display_name)||user.email.split('@')[0]):(S.demoName?esc(S.demoName):'Entrar');
async function initAuth(){
  if(!CFG.url||!window.supabase)return;
  sb=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  const {data}=await sb.auth.getSession();user=data.session?data.session.user:null;
  sb.auth.onAuthStateChange((ev,ses)=>{user=ses?ses.user:null;profile=null;if(ev=='PASSWORD_RECOVERY'){afterLogin().then(()=>{$('modal').classList.add('on');pwForm()});return}afterLogin()});
  await afterLogin();
}
async function afterLogin(){
  if(sb&&user){
    const p=await sb.from('profiles').select('display_name,is_premium,avatar').eq('id',user.id).maybeSingle();
    profile=p.data;S.premium=!!(profile&&profile.is_premium);
    const t=await sb.from('tournaments').select('data').order('updated_at',{ascending:false}).limit(1).maybeSingle();
    if(t.data&&t.data.data){const premium=S.premium;S=Object.assign(def(),t.data.data);S.premium=premium}
  }else if(sb){S.premium=false}
  render();
}
function cloudSave(){
  if(!sb||!user)return;clearTimeout(saveT);
  saveT=setTimeout(async()=>{const d=Object.assign({},S);delete d.premium;
    const cur=await sb.from('tournaments').select('id').order('updated_at',{ascending:false}).limit(1).maybeSingle();
    const row={name:String(S.name).slice(0,80),data:d};
    if(cur.data)await sb.from('tournaments').update(row).eq('id',cur.data.id);
    else await sb.from('tournaments').insert(row)},1200);
}
function openAuth(){
  if(user){accountHome();
  }else if(!CFG.url){
    $('modalBody').innerHTML=`<h2>Cuenta (demostración)</h2><p class="small">En esta demo no hay servidor: no se guardan contraseñas ni datos fuera de este dispositivo. En la versión real, el registro verifica el email y los torneos se guardan en tu cuenta.</p>
    <label for="dn">Tu apodo</label><input id="dn" maxlength="24" value="${esc(S.demoName||'')}" autocomplete="nickname">
    <div class="row" style="margin-top:12px"><button onclick="S.demoName=$('dn').value.trim().slice(0,24);save();closeModal();render()">Guardar</button><button class="sec" onclick="closeModal()">Cancelar</button></div>`;
  }else authForm();
  $('modal').classList.add('on');
}
function authForm(msg=''){
  const reg=authMode=='register';
  $('modalBody').innerHTML=`<h2>${reg?'Crear cuenta':'Entrar'}</h2>
  ${reg?'<label for="au-n">Apodo</label><input id="au-n" maxlength="24" autocomplete="nickname">':''}
  <label for="au-e">Email</label><input id="au-e" type="email" maxlength="254" autocomplete="email">
  <label for="au-p">Contraseña ${reg?'(mínimo 10 caracteres)':''}</label><input id="au-p" type="password" maxlength="72" autocomplete="${reg?'new-password':'current-password'}">
  ${reg?'<label style="display:flex;gap:8px;align-items:flex-start;color:var(--tx)"><input id="au-t" type="checkbox" style="width:auto;margin-top:3px"><span>Acepto los términos y la <a href="privacidad.html" target="_blank" rel="noopener" style="color:var(--ac)">política de privacidad</a></span></label>':''}
  <div id="au-c" style="margin-top:8px"></div>
  <div class="err" id="au-m" role="alert">${msg}</div>
  <div class="row"><button onclick="doAuth()">${reg?'Registrarme':'Entrar'}</button><button class="sec" onclick="closeModal()">Cancelar</button></div>
  <p class="small" style="margin-top:12px"><a href="#" style="color:var(--ac)" onclick="authMode='${reg?'login':'register'}';authForm();return false">${reg?'Ya tengo cuenta':'Crear una cuenta'}</a>
  ${reg?'':' · <a href="#" style="color:var(--mut)" onclick="resetPw();return false">Olvidé mi contraseña</a>'}</p>`;
  capInit();
}
let capId=null,capToken='';
function capOpt(){const t=capToken;capToken='';if(capId!==null&&window.turnstile)try{window.turnstile.reset(capId)}catch(e){}return t?{captchaToken:t}:{}}
function capInit(){
  const box=$('au-c');if(!CFG.captcha||!box)return;capId=null;
  const go=()=>{capId=window.turnstile.render(box,{sitekey:CFG.captcha,theme:'dark',callback:t=>{capToken=t},'expired-callback':()=>{capToken=''}})};
  if(window.turnstile)return go();
  const sc=document.createElement('script');sc.src='https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';sc.async=true;sc.onload=go;document.head.appendChild(sc);
}
async function exportData(){
  const t=await sb.from('tournaments').select('*');
  const blob=new Blob([JSON.stringify({email:user.email,perfil:profile,torneos:t.data||[]},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mis-datos-torneazo.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function askDelete(){
  $('modalBody').innerHTML=`<h2>Borrar mi cuenta</h2><p>Se borran para siempre tu cuenta y todos tus torneos. Si pagas Premium, cancela antes la suscripción.</p>
  <label for="del">Escribe BORRAR para confirmar</label><input id="del" autocomplete="off">
  <div class="err" id="del-m" role="alert"></div>
  <div class="row"><button onclick="delAccount()">Borrar definitivamente</button><button class="sec" onclick="closeModal()">Cancelar</button></div>`;
}
async function delAccount(){
  if($('del').value.trim()!=='BORRAR'){$('del-m').textContent='Escribe BORRAR en mayúsculas.';return}
  const r=await sb.rpc('borrar_mi_cuenta');
  if(r.error){$('del-m').textContent='No se pudo borrar. Inténtalo de nuevo.';return}
  try{localStorage.removeItem('torneazo')}catch(e){}
  await sb.auth.signOut();S=def();closeModal();render();
}
const okEmail=e=>/^[^\s@]{1,64}@[^\s@]+\.[^\s@]{2,}$/.test(e)&&e.length<=254;
const okPw=p=>p.length>=10&&p.length<=72&&/[a-z]/i.test(p)&&/\d/.test(p);
async function doAuth(){
  const m=$('au-m'),e=$('au-e').value.trim().toLowerCase(),p=$('au-p').value,reg=authMode=='register';
  if(Date.now()<authLock){m.textContent='Espera unos segundos antes de reintentar.';return}
  if(!okEmail(e)){m.textContent='Escribe un email válido.';return}
  if(reg&&!okPw(p)){m.textContent='La contraseña necesita 10 o más caracteres, con letras y números.';return}
  if(reg&&!$('au-t').checked){m.textContent='Para crear la cuenta debes aceptar los términos y la política de privacidad.';return}
  authLock=Date.now()+3000;
  try{
    if(reg){const n=($('au-n').value||'').trim().slice(0,24)||e.split('@')[0];
      const r=await sb.auth.signUp({email:e,password:p,options:{data:{display_name:n,accepted_terms_at:new Date().toISOString(),terms_version:TERMS},emailRedirectTo:location.origin+location.pathname,...capOpt()}});
      if(r.error)throw r.error;
      $('modalBody').innerHTML='<h2>Revisa tu email</h2><p>Te hemos enviado un enlace para confirmar la cuenta.</p><button onclick="closeModal()">Vale</button>';
    }else{const r=await sb.auth.signInWithPassword({email:e,password:p,options:capOpt()});
      if(r.error)throw r.error;closeModal()}
  }catch(x){m.textContent=reg?'No se pudo crear la cuenta. Revisa los datos o prueba a entrar.':'Email o contraseña incorrectos.'}
}
async function resetPw(){
  const e=($('au-e').value||'').trim().toLowerCase();
  if(!okEmail(e)){$('au-m').textContent='Escribe tu email arriba.';return}
  await sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname,...capOpt()});
  $('au-m').innerHTML='<span class="ok">Si el email existe, recibirás un enlace.</span>';
}
async function logout(all){await sb.auth.signOut({scope:all?'global':'local'});closeModal()}

/* ===== Perfil de usuario ===== */
let pendAv;
const done=m=>{$('modalBody').innerHTML=`<h2>Listo</h2><p>${m}</p><button onclick="accountHome()">Vale</button>`};
function accountHome(){
  const nm=esc((profile&&profile.display_name)||user.email.split('@')[0]);
  $('modalBody').innerHTML=`<div style="display:flex;gap:12px;align-items:center;margin-bottom:10px">${avImg(profile&&profile.avatar,56)}
    <div style="min-width:0"><h2 style="margin:0">${nm}</h2><div class="small" style="overflow-wrap:anywhere">${esc(user.email)}</div></div></div>
  <p class="small">${S.premium?'Plan Premium activo.':'Plan gratuito.'} Tus torneos se guardan en tu cuenta.</p>
  <div class="row" style="margin-bottom:8px"><button onclick="profForm()">Editar perfil</button><button class="sec" onclick="pwForm()">Contraseña</button></div>
  <div class="row" style="margin-bottom:8px"><button class="sec" onclick="mailForm()">Cambiar email</button><button class="sec" onclick="exportData()">Descargar mis datos</button></div>
  ${S.premium&&CFG.portal?'<div class="row" style="margin-bottom:8px"><button class="sec" onclick="window.open(CFG.portal,\'_blank\',\'noopener\')">Gestionar suscripción</button></div>':''}
  <div class="row"><button class="sec" onclick="logout()">Cerrar sesión</button><button class="sec" onclick="logout(true)">Salir en todos los dispositivos</button></div>
  <div class="row" style="margin-top:10px"><button onclick="closeModal()">Cerrar</button></div>
  <p class="small" style="margin-top:14px"><a href="#" style="color:#ff8a80" onclick="askDelete();return false">Borrar mi cuenta y mis datos</a> · <a href="privacidad.html" target="_blank" rel="noopener" style="color:var(--mut)">Privacidad</a></p>`;
}
function profForm(){
  pendAv=undefined;
  $('modalBody').innerHTML=`<h2>Editar perfil</h2>
  <div style="display:flex;gap:12px;align-items:center"><span id="pv">${avImg(profile&&profile.avatar,72)}</span>
    <div><input id="pf-f" type="file" accept="image/jpeg,image/png,image/webp" style="display:none" onchange="pickAv(this)">
    <button class="sec" onclick="$('pf-f').click()">Cambiar foto</button> <button class="sec" onclick="rmAv()">Quitar</button></div></div>
  <label for="pf-n">Apodo</label><input id="pf-n" maxlength="24" autocomplete="nickname" value="${esc((profile&&profile.display_name)||'')}">
  <div class="err" id="pf-m" role="alert"></div>
  <div class="row"><button onclick="saveProf()">Guardar</button><button class="sec" onclick="accountHome()">Volver</button></div>`;
}
function pickAv(inp){
  const f=inp.files&&inp.files[0],m=$('pf-m');if(!f)return;
  if(!/^image\/(jpeg|png|webp)$/.test(f.type)||f.size>8e6){m.textContent='Elige una imagen JPG, PNG o WebP de menos de 8 MB.';return}
  const r=new FileReader();
  r.onload=()=>{const img=new Image();
    img.onload=()=>{const z=160,c=document.createElement('canvas');c.width=c.height=z;const k=Math.min(img.width,img.height);
      c.getContext('2d').drawImage(img,(img.width-k)/2,(img.height-k)/2,k,k,0,0,z,z);
      pendAv=c.toDataURL('image/jpeg',.82);$('pv').innerHTML=avImg(pendAv,72);m.textContent=''};
    img.onerror=()=>{m.textContent='No se pudo leer la imagen.'};img.src=r.result};
  r.readAsDataURL(f);
}
function rmAv(){pendAv='';$('pv').innerHTML=avImg('',72)}
async function saveProf(){
  const n=$('pf-n').value.trim(),m=$('pf-m');
  if(n.length<1||n.length>24){m.textContent='El apodo debe tener entre 1 y 24 caracteres.';return}
  const row={display_name:n};if(pendAv!==undefined)row.avatar=pendAv===''?null:pendAv;
  const r=await sb.from('profiles').update(row).eq('id',user.id);
  if(r.error){m.textContent='No se pudo guardar. Inténtalo de nuevo.';return}
  profile=Object.assign({},profile,row);render();accountHome();
}
function pwForm(){
  $('modalBody').innerHTML=`<h2>Cambiar contraseña</h2>
  <label for="pw1">Nueva contraseña (10 o más caracteres, con letras y números)</label><input id="pw1" type="password" maxlength="72" autocomplete="new-password">
  <label for="pw2">Repítela</label><input id="pw2" type="password" maxlength="72" autocomplete="new-password">
  <div class="err" id="pw-m" role="alert"></div>
  <div class="row"><button onclick="savePw()">Cambiar</button><button class="sec" onclick="${user?'accountHome()':'closeModal()'}">Cancelar</button></div>`;
}
async function savePw(){
  const a=$('pw1').value,b=$('pw2').value,m=$('pw-m');
  if(!okPw(a)){m.textContent='La contraseña necesita 10 o más caracteres, con letras y números.';return}
  if(a!==b){m.textContent='Las dos contraseñas no coinciden.';return}
  const r=await sb.auth.updateUser({password:a});
  if(r.error){m.textContent='No se pudo cambiar. Si hace tiempo que entraste, cierra sesión, vuelve a entrar e inténtalo otra vez.';return}
  done('Tu contraseña se ha cambiado.');
}
function mailForm(){
  $('modalBody').innerHTML=`<h2>Cambiar email</h2><p class="small">Ahora: ${esc(user.email)}. Te enviaremos un enlace de confirmación.</p>
  <label for="nm-e">Nuevo email</label><input id="nm-e" type="email" maxlength="254" autocomplete="email">
  <div class="err" id="nm-m" role="alert"></div>
  <div class="row"><button onclick="saveMail()">Cambiar</button><button class="sec" onclick="accountHome()">Cancelar</button></div>`;
}
async function saveMail(){
  const e=$('nm-e').value.trim().toLowerCase(),m=$('nm-m');
  if(!okEmail(e)){m.textContent='Escribe un email válido.';return}
  const r=await sb.auth.updateUser({email:e},{emailRedirectTo:location.origin+location.pathname});
  if(r.error){m.textContent='No se pudo cambiar el email. Inténtalo de nuevo.';return}
  done('Revisa tu correo: te hemos enviado un enlace para confirmar el cambio (puede que también al email anterior).');
}

/* ===== Celebración ===== */
function afterRender(){
  const c=document.querySelector('.champ');
  if(c){const k=c.textContent;if(window._cel!==k){window._cel=k;if(!firstRender)confetti()}}
  firstRender=false;
}
function confetti(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const cv=document.createElement('canvas');cv.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:20';
  cv.width=innerWidth;cv.height=innerHeight;document.body.appendChild(cv);const g=cv.getContext('2d'),cols=['#9BEA1C','#F2F5EF','#6BB300','#C8FF5A'];
  const P=Array.from({length:140},()=>({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*16,vy:-Math.random()*15-3,s:5+Math.random()*7,c:cols[Math.random()*4|0],r:Math.random()*6}));
  let f=0;(function t(){g.clearRect(0,0,cv.width,cv.height);
    P.forEach(p=>{p.vy+=.36;p.x+=p.vx;p.y+=p.vy;p.r+=.2;g.fillStyle=p.c;g.save();g.translate(p.x,p.y);g.rotate(p.r);g.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);g.restore()});
    if(++f<120)requestAnimationFrame(t);else cv.remove()})();
}
render();initAuth();
</script>
</body>
</html>
