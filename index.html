<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TORNEAZO</title>
<!--REPO-ONLY-START--><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co https://api.pwnedpasswords.com; frame-src https://challenges.cloudflare.com; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; upgrade-insecure-requests">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="favicon.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#070807"><!--REPO-ONLY-END-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@1,700;1,800&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#070807;--card:#121512;--line:#232923;--tx:#F2F5EF;--mut:#9AA595;--ac:#9BEA1C;--ok:#9BEA1C;--gold:#E9ECE6;--ink:#0A0B0A}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font:1rem/1.45 Inter,system-ui,sans-serif;padding-bottom:90px}
html{-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding-top:max(22px,calc(env(safe-area-inset-top,0px) + 12px));padding-bottom:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:16px;min-height:48px}
header .brand>div{min-width:0}header .brand small{display:flex;align-items:center;gap:6px;white-space:nowrap}
h1,h2,.brand{font-family:'Exo 2',Inter,sans-serif;font-style:italic;font-weight:800}h1{font-size:24px;margin:0;line-height:1}h2{font-size:19px;margin:0 0 10px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:56px;height:42px;object-fit:contain}.brand small{display:block;font:500 11px Inter,sans-serif;font-style:normal;color:var(--mut);margin-top:3px}.brand b{color:var(--ac)}h3{font-size:15px;margin:14px 0 6px;color:var(--mut)}
.badge{font-size:12px;padding:3px 8px;border-radius:99px;background:var(--line);color:var(--mut)}
.badge.pro{background:var(--ac);color:var(--ink);font-weight:700}
.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:12px}
.tab{flex:1;min-width:90px;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--mut);text-align:center;cursor:pointer;font-size:14px}
.tab.on{background:var(--ac);color:var(--ink);font-weight:700;border-color:var(--ac)}.tab.off{opacity:.4;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:110px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
button{padding:11px 14px;border:0;border-radius:10px;background:var(--ac);color:var(--ink);font:inherit;font-family:'Exo 2',Inter,sans-serif;font-style:italic;font-weight:800;letter-spacing:.3px;cursor:pointer}
button.sec{background:var(--line);color:var(--tx)}button.gold{background:var(--gold);color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 11px;border-radius:99px;border:1px solid var(--line);background:var(--bg);color:var(--mut);cursor:pointer;font-size:14px}
.chip.on{background:var(--ac);color:var(--ink);font-weight:600;border-color:var(--ac)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--line)}
th:nth-child(2),td:nth-child(2){text-align:left}th{color:var(--mut);font-weight:500}
tr.q td{color:var(--ok);font-weight:600}
.match{display:grid;grid-template-columns:1fr 48px 12px 48px 1fr;gap:6px;align-items:center;margin:6px 0;font-size:14px}
.match input{padding:6px;text-align:center}.match .a{text-align:right}
.small{font-size:12px;color:var(--mut)}
.round{margin-bottom:6px}
.ko{padding:8px 0;border-bottom:1px solid var(--line)}
.champ{text-align:center;font-size:20px;padding:18px;background:#0F130E;border-radius:14px;border:2px solid var(--ac);font-family:'Exo 2',Inter,sans-serif;font-style:italic}
.ad{position:fixed;left:0;right:0;bottom:0;background:#fff;color:#333;text-align:center;padding:10px max(10px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));font-size:13px;border-top:3px solid var(--ac)}
.ad b{color:#d33}.ad span{cursor:pointer;text-decoration:underline;color:#2B6A00;margin-left:8px}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal.on{display:flex}.modal .card{max-width:420px}
ul{padding-left:18px;margin:6px 0}

/* ===== Animaciones ===== */
:root{--ease:cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 #9BEA1C55}50%{box-shadow:0 0 0 9px #9BEA1C00}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes champ{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.06)}100%{transform:none;opacity:1}}
@keyframes shine{from{background-position:-200% 0}to{background-position:200% 0}}
.brand img{animation:floaty 4s ease-in-out infinite;filter:drop-shadow(0 0 8px #9BEA1C55)}
.anim .card,.anim .champ,.anim .tabs{animation:rise .5s var(--ease) both}
.anim .card:nth-of-type(1),.anim .champ{animation-delay:.04s}.anim .card:nth-of-type(2){animation-delay:.1s}
.anim .card:nth-of-type(3){animation-delay:.16s}.anim .card:nth-of-type(4){animation-delay:.22s}
.anim .card:nth-of-type(n+5){animation-delay:.28s}
.anim .champ{animation:champ .8s var(--ease) both}
button{position:relative;overflow:hidden;transition:transform .15s var(--ease),box-shadow .2s,filter .2s}
button:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.08);box-shadow:0 8px 20px #9BEA1C33}
button:active:not(:disabled){transform:translateY(0) scale(.96)}
button:not(.sec):not(.gold):not(.acct)::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,#ffffff66 50%,transparent 70%);background-size:200% 100%;opacity:0}
button:not(.sec):not(.gold):not(.acct):hover::after{opacity:1;animation:shine .9s linear}
.card>.row>button:first-child:not(.sec){animation:glow 2.4s ease-in-out infinite}
.chip,.tab{transition:background .2s,color .2s,border-color .2s,transform .15s var(--ease)}
.chip:hover,.tab:not(.off):hover{transform:translateY(-2px);border-color:var(--ac)}
.chip:active{transform:scale(.94)}
input,select,textarea{transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px #9BEA1C33}
.match input:focus{transform:scale(1.08)}
tr{transition:background .2s}tr:hover{background:#9BEA1C0d}
.modal.on{animation:fade .2s both}.modal.on .card{animation:pop .3s var(--ease) both}
.ad{animation:rise .6s var(--ease) .4s both}
.acct{background:var(--card);color:var(--tx);border:1px solid var(--line);font:600 13px Inter,sans-serif;font-style:normal;padding:6px 12px;border-radius:99px;letter-spacing:0}
.hdr-r{display:flex;align-items:center;gap:6px;flex:none;min-width:0}
.acct{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-height:40px}
#tt-help{min-width:40px;padding-left:0;padding-right:0}
.modal .card{max-height:92vh;overflow:auto}
.upd{position:fixed;top:0;left:0;right:0;z-index:30;background:var(--ac);color:var(--ink);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;font-weight:600;animation:slideDown .4s var(--ease) both}
.upd span{flex:1 1 180px}.upd button{background:var(--ink);color:var(--ac);padding:8px 12px;font-size:13px}
.upd button.sec{background:#0A0B0A33;color:var(--ink)}
@keyframes slideDown{from{transform:translateY(-100%)}to{transform:none}}
.dots{display:flex;gap:6px;margin:4px 0 12px}.dots i{width:8px;height:8px;border-radius:99px;background:var(--line);transition:all .25s var(--ease)}.dots i.on{width:22px;background:var(--ac)}
.step{animation:slideIn .3s var(--ease) both}.step .num{display:inline-flex;width:44px;height:44px;border-radius:50%;background:var(--ac);color:var(--ink);align-items:center;justify-content:center;font:800 20px 'Exo 2',Inter,sans-serif;font-style:italic;margin-bottom:8px}
.tut{position:fixed;inset:0;z-index:9000;background:rgba(2,8,5,.78);animation:fade .25s both}.tut.on-el{background:transparent}
.tut-hole{position:fixed;display:none;border-radius:16px;box-shadow:0 0 0 3px var(--ac),0 0 0 9999px rgba(2,8,5,.78);pointer-events:none;transition:all .3s var(--ease)}
.tut-card{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(440px,calc(100vw - 32px));box-sizing:border-box;background:var(--card);border:1px solid #2F372D;border-radius:16px;padding:18px 18px 14px;box-shadow:0 18px 50px #000a;animation:fade .3s both}
.tut:not(.on-el) .tut-card{bottom:auto;top:50%;transform:translate(-50%,-50%)}
.tut-card.top{bottom:auto;top:calc(18px + env(safe-area-inset-top,0px))}
.tut-card .kicker{font-size:12px;color:var(--mut);letter-spacing:.5px;text-transform:uppercase}
.tut-card h2{margin:4px 0 8px;font-size:24px}.tut-card p{margin:0;color:var(--mut);line-height:1.45}
.tut-dots{display:flex;gap:5px;justify-content:center;margin:14px 0 10px}.tut-dots i{width:6px;height:6px;border-radius:9px;background:#2F372D;transition:all .25s var(--ease)}.tut-dots i.on{width:18px;background:var(--ac)}
.tut-btns{display:flex;align-items:center;gap:8px}.tut-btns span{flex:1}
.tg{display:inline-flex;align-items:center;gap:6px;min-width:0;max-width:100%}.tg>span{overflow:hidden;text-overflow:ellipsis}
.tl{width:18px;height:18px;border-radius:50%;object-fit:cover;flex:none}.td{width:10px;height:10px;border-radius:50%;flex:none}
.cs{font:700 10px Inter,sans-serif;background:var(--ac);color:var(--ink);padding:1px 5px;border-radius:99px;flex:none}
.match .a .tg{justify-content:flex-end}
.trow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.sm{padding:7px 12px;font-size:13px}select.mini{width:auto;padding:7px 8px}
.sw{width:32px;height:32px;padding:0;border-radius:50%;border:2px solid #0006}
button:focus-visible,.chip:focus-visible,.tab:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.view{min-width:0}.gwrap{display:block}
@media (min-width:720px){
  html{font-size:17px}
  .wrap{max-width:1040px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
  header{margin-bottom:22px}
  .brand img{width:68px;height:52px}h1{font-size:30px}h2{font-size:21px}
  .tabs{gap:10px;margin-bottom:20px}.tab{padding:12px;font-size:15px}
  .view{display:grid;gap:18px;align-items:start}.view>.card,.view>.champ{margin:0}
  .v0{grid-template-columns:repeat(2,minmax(0,1fr))}
  .v0 #tt-datos,.v0 #tt-info,.v0 #tt-reglas{grid-column:1}.v0 #tt-part{grid-column:2;grid-row:1/span 3}.v0 #tt-publico,.v0 #tt-inscr{grid-column:2}
  .gwrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:6px 28px}
  .v2,.v3{grid-template-columns:repeat(auto-fill,minmax(360px,1fr))}
  .v2>#tt-sigfase,.v2>.card:last-child,.v3>.champ,.v3>.card:last-child{grid-column:1/-1}
  .v2>.champ{grid-column:1/-1}
  .modal .card{max-width:520px}
  .match{font-size:15px}
}
@media (min-width:1100px){.v2,.v3{grid-template-columns:repeat(auto-fill,minmax(400px,1fr))}}
@media (max-width:380px){h1{font-size:21px}.brand img{width:46px;height:35px}.acct{max-width:110px;padding-left:10px;padding-right:10px}.tab{min-width:80px;font-size:13px}}
.detect{background:#0F130E;border:1px solid #2F372D;border-radius:12px;padding:10px 12px;margin:10px 0}.detect .small{margin:4px 0}
.bad{color:#ff8a80!important}.lvlist{max-height:46vh;overflow:auto;margin-top:8px}
.pz{margin-bottom:12px}
.v4{min-width:0}
@media (max-width:480px){.tab{min-width:0;font-size:12px;padding:8px 4px}}
@media (min-width:720px){.v4{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}.v4>.card:last-child{grid-column:1/-1}}
.statusbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 14px;padding:10px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.statusbar>div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st{font:700 12px Inter,sans-serif;padding:4px 10px;border-radius:99px;background:var(--line);color:var(--tx);flex:none;white-space:nowrap}
.st.live{background:var(--ac);color:var(--ink)}.st.done{background:#E9ECE6;color:var(--ink)}
.irow{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}.irow>span:last-child{text-align:right;min-width:0;overflow-wrap:anywhere}
.ro .noro,.ro button,.ro select.mini,.ro .trow>button{display:none!important}
.ro .regform button,.ro .keepro button{display:inline-block!important}
.ro .keepro button.noro{display:none!important}
.regform input,.regform select{margin-bottom:6px}
.ro input,.ro select,.ro textarea{opacity:1;color:var(--tx);cursor:default}

.crow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.ctime{min-width:56px;display:flex;flex-direction:column}.ctime small{color:var(--mut);font-size:11px}
.cmatch{flex:1;min-width:0}.cmatch .tgs{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.cres{min-width:36px;text-align:right}.cday h3{margin:0 0 4px;color:var(--ac);text-transform:capitalize}
.when{margin:2px 0 6px;text-align:center}.seg{margin-bottom:12px}

.dcard .dtop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.dcard h3{margin:0;color:var(--tx);font-size:18px;overflow-wrap:anywhere}
.btnlink{display:inline-block;margin-top:6px;padding:11px 16px;border-radius:10px;background:var(--ac);color:var(--ink);font-weight:700;text-decoration:none;font-family:'Exo 2',Inter,sans-serif;font-style:italic}
.btnlink:hover{filter:brightness(1.08)}
@media (min-width:720px){.vDir{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px;align-items:start}.vDir>#tt-dir,.vDir>.row{grid-column:1/-1}}
.news h3{color:var(--ac);margin:12px 0 4px}.news ul{margin:4px 0 8px}
.err{color:#ff8a80;font-size:13px;min-height:18px;margin:6px 0 0}
.ok{color:var(--ac);font-size:13px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="modal" id="modal"><div class="card" id="modalBody"></div></div>
<!--REPO-ONLY-START--><script src="config.js"></script><script src="supabase.js"></script><!--REPO-ONLY-END-->
<script src="app.js"></script>
</body>
</html>
