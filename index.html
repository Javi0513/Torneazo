<style>

*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font:1rem/1.45 Inter,system-ui,sans-serif;padding-bottom:90px}

header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:16px;min-height:48px}
header .brand>div{min-width:0}header .brand small{display:flex;align-items:center;gap:6px;white-space:nowrap}
h1,h2,.brand{font-family:'Exo 2',Inter,sans-serif;font-style:italic;font-weight:800}h1{font-size:24px;margin:0;line-height:1}h2{font-size:19px;margin:0 0 10px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:56px;height:42px;object-fit:contain}.brand small{display:block;font:500 11px Inter,sans-serif;font-style:normal;color:var(--mut);margin-top:3px}.brand b{color:var(--ac)}h3{font-size:15px;margin:14px 0 6px;color:var(--mut)}
.badge{font-size:12px;padding:3px 8px;border-radius:99px;background:var(--line);color:var(--mut)}

input,select,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:110px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
button{padding:11px 14px;border:0;border-radius:10px;background:var(--ac);color:var(--ink);font:inherit;font-family:'Exo 2',Inter,sans-serif;font-style:italic;font-weight:800;letter-spacing:.3px;cursor:pointer}
button.sec{background:var(--line);color:var(--tx)}button.gold{background:var(--gold);color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 11px;border-radius:99px;border:1px solid var(--line);background:var(--bg);color:var(--mut);cursor:pointer;font-size:14px}

th:nth-child(2),td:nth-child(2){text-align:left}th{color:var(--mut);font-weight:500}
tr.q td{color:var(--ok);font-weight:600}
.match{display:grid;grid-template-columns:1fr 48px 12px 48px 1fr;gap:6px;align-items:center;margin:6px 0;font-size:14px}

.ad{position:fixed;left:0;right:0;bottom:0;background:#fff;color:#333;text-align:center;padding:10px max(10px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));font-size:13px;border-top:3px solid var(--ac)}
.ad b{color:#d33}.ad span{cursor:pointer;text-decoration:underline;color:#2B6A00;margin-left:8px}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal.on{display:flex}.modal .card{max-width:420px}
ul{padding-left:18px;margin:6px 0}

/* ===== Animaciones ===== */
:root{--ease:cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 #9BEA1C55}50%{box-shadow:0 0 0 9px #9BEA1C00}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes champ{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.06)}100%{transform:none;opacity:1}}
@keyframes shine{from{background-position:-200% 0}to{background-position:200% 0}}
.brand img{animation:floaty 4s ease-in-out infinite;filter:drop-shadow(0 0 8px #9BEA1C55)}
.anim .card,.anim .champ,.anim .tabs{animation:rise .5s var(--ease) both}
.anim .card:nth-of-type(1),.anim .champ{animation-delay:.04s}.anim .card:nth-of-type(2){animation-delay:.1s}
.anim .card:nth-of-type(3){animation-delay:.16s}.anim .card:nth-of-type(4){animation-delay:.22s}
.anim .card:nth-of-type(n+5){animation-delay:.28s}
.anim .champ{animation:champ .8s var(--ease) both}
button{position:relative;overflow:hidden;transition:transform .15s var(--ease),box-shadow .2s,filter .2s}
button:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.08);box-shadow:0 8px 20px #9BEA1C33}
button:active:not(:disabled){transform:translateY(0) scale(.96)}
button:not(.sec):not(.gold):not(.acct)::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,#ffffff66 50%,transparent 70%);background-size:200% 100%;opacity:0}
button:not(.sec):not(.gold):not(.acct):hover::after{opacity:1;animation:shine .9s linear}
.card>.row>button:first-child:not(.sec){animation:glow 2.4s ease-in-out infinite}
.chip,.tab{transition:background .2s,color .2s,border-color .2s,transform .15s var(--ease)}
.chip:hover,.tab:not(.off):hover{transform:translateY(-2px);border-color:var(--ac)}
.chip:active{transform:scale(.94)}
input,select,textarea{transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px #9BEA1C33}
.match input:focus{transform:scale(1.08)}
tr{transition:background .2s}tr:hover{background:#9BEA1C0d}
.modal.on{animation:fade .2s both}.modal.on .card{animation:pop .3s var(--ease) both}
.ad{animation:rise .6s var(--ease) .4s both}
.acct{background:var(--card);color:var(--tx);border:1px solid var(--line);font:600 13px Inter,sans-serif;font-style:normal;padding:6px 12px;border-radius:99px;letter-spacing:0}
.hdr-r{display:flex;align-items:center;gap:6px;flex:none;min-width:0}
.acct{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-height:40px}
#tt-help{min-width:40px;padding-left:0;padding-right:0}
.modal .card{max-height:92vh;overflow:auto}
.upd{position:fixed;top:0;left:0;right:0;z-index:30;background:var(--ac);color:var(--ink);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;font-weight:600;animation:slideDown .4s var(--ease) both}
.upd span{flex:1 1 180px}.upd button{background:var(--ink);color:var(--ac);padding:8px 12px;font-size:13px}
.upd button.sec{background:#0A0B0A33;color:var(--ink)}
@keyframes slideDown{from{transform:translateY(-100%)}to{transform:none}}
.dots{display:flex;gap:6px;margin:4px 0 12px}.dots i{width:8px;height:8px;border-radius:99px;background:var(--line);transition:all .25s var(--ease)}.dots i.on{width:22px;background:var(--ac)}
.step{animation:slideIn .3s var(--ease) both}.step .num{display:inline-flex;width:44px;height:44px;border-radius:50%;background:var(--ac);color:var(--ink);align-items:center;justify-content:center;font:800 20px 'Exo 2',Inter,sans-serif;font-style:italic;margin-bottom:8px}
.tut{position:fixed;inset:0;z-index:9000;background:rgba(2,8,5,.78);animation:fade .25s both}.tut.on-el{background:transparent}
.tut-hole{position:fixed;display:none;border-radius:16px;box-shadow:0 0 0 3px var(--ac),0 0 0 9999px rgba(2,8,5,.78);pointer-events:none;transition:all .3s var(--ease)}
.tut-card{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(440px,calc(100vw - 32px));box-sizing:border-box;background:var(--card);border:1px solid #2F372D;border-radius:16px;padding:18px 18px 14px;box-shadow:0 18px 50px #000a;animation:fade .3s both}
.tut:not(.on-el) .tut-card{bottom:auto;top:50%;transform:translate(-50%,-50%)}
.tut-card.top{bottom:auto;top:calc(18px + env(safe-area-inset-top,0px))}
.tut-card .kicker{font-size:12px;color:var(--mut);letter-spacing:.5px;text-transform:uppercase}
.tut-card h2{margin:4px 0 8px;font-size:24px}.tut-card p{margin:0;color:var(--mut);line-height:1.45}
.tut-dots{display:flex;gap:5px;justify-content:center;margin:14px 0 10px}.tut-dots i{width:6px;height:6px;border-radius:9px;background:#2F372D;transition:all .25s var(--ease)}.tut-dots i.on{width:18px;background:var(--ac)}
.tut-btns{display:flex;align-items:center;gap:8px}.tut-btns span{flex:1}
.tg{display:inline-flex;align-items:center;gap:6px;min-width:0;max-width:100%}.tg>span{overflow:hidden;text-overflow:ellipsis}
.tl{width:18px;height:18px;border-radius:50%;object-fit:cover;flex:none}.td{width:10px;height:10px;border-radius:50%;flex:none}
.cs{font:700 10px Inter,sans-serif;background:var(--ac);color:var(--ink);padding:1px 5px;border-radius:99px;flex:none}
.match .a .tg{justify-content:flex-end}
.trow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.sm{padding:7px 12px;font-size:13px}select.mini{width:auto;padding:7px 8px}
.sw{width:32px;height:32px;padding:0;border-radius:50%;border:2px solid #0006}
button:focus-visible,.chip:focus-visible,.tab:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.view{min-width:0}.gwrap{display:block}
@media (min-width:720px){
  html{font-size:17px}
  .wrap{max-width:1040px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
  header{margin-bottom:22px}
  .brand img{width:68px;height:52px}h1{font-size:30px}h2{font-size:21px}

@media (min-width:1100px){.v2,.v3{grid-template-columns:repeat(auto-fill,minmax(400px,1fr))}}
@media (max-width:380px){h1{font-size:21px}.brand img{width:46px;height:35px}.acct{max-width:110px;padding-left:10px;padding-right:10px}.tab{min-width:80px;font-size:13px}}
.detect{background:#0F130E;border:1px solid #2F372D;border-radius:12px;padding:10px 12px;margin:10px 0}.detect .small{margin:4px 0}
.bad{color:#ff8a80!important}.lvlist{max-height:46vh;overflow:auto;margin-top:8px}

.v4{min-width:0}
@media (max-width:480px){.tab{min-width:0;font-size:12px;padding:8px 4px}}
@media (min-width:720px){.v4{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}.v4>.card:last-child{grid-column:1/-1}}
.statusbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 14px;padding:10px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px}

.st{font:700 12px Inter,sans-serif;padding:4px 10px;border-radius:99px;background:var(--line);color:var(--tx);flex:none;white-space:nowrap}

/* ===== Fondo 1.25 ===== */
body{background:var(--bg)}
body::before{content:'';position:fixed;inset:0;z-index:-2;background:url(fondo-movil.webp) center top/cover no-repeat}
body::after{content:'';position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(7,8,7,.7) 0,rgba(7,8,7,.86) 40%,rgba(7,8,7,.94) 100%)}
@media (min-width:760px){body::before{background-image:url(fondo.webp);background-position:center}}
body.is-home::after{background:linear-gradient(180deg,rgba(7,8,7,.7) 0,rgba(7,8,7,.2) 14%,rgba(7,8,7,.35) 38%,rgba(7,8,7,.82) 70%,rgba(7,8,7,.94) 100%)}
.tab{background-color:rgba(18,21,18,.85);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}.tab.on{background:var(--ac)}
header{text-shadow:0 2px 10px rgba(0,0,0,.7)}
.card,.sbar,.shero,.statusbar{background-color:rgba(18,21,18,.82);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.shero,.sbar{background-image:linear-gradient(120deg,rgba(16,21,16,.85),rgba(11,14,10,.85))}
.is-home .hero{text-align:center;padding:24vh 4px 18px;max-width:820px;margin:0 auto}
.is-home .hero h2{text-shadow:0 4px 24px rgba(0,0,0,.8)}.is-home .hero p{color:#cfd6cb;text-shadow:0 2px 12px rgba(0,0,0,.9)}
.is-home .hero .row{max-width:560px;margin:0 auto}
.is-home .hsec{text-shadow:0 2px 12px rgba(0,0,0,.8)}
@media (min-width:760px){.is-home .hero{padding-top:30vh}}

/* ===== Fases 1.26 ===== */
.plan{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:14px;background:rgba(0,0,0,.25)}
.prow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid var(--line)}
.prow>select{flex:1;min-width:150px;width:auto}.prow .stepn{margin:0}.prow.lock{opacity:.7}
.prow .pl{display:flex;align-items:center;gap:6px;margin:0;font-size:12px}.prow .pl select{width:auto;padding:7px 8px}
.parr{width:2px;height:14px;margin:2px 0 2px 21px;background:linear-gradient(var(--ac),transparent)}
.phline{display:flex;flex-wrap:wrap;gap:8px}
.phs{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.2);flex:1;min-width:160px}
.phs>div{flex:1;min-width:0;display:flex;flex-direction:column}.phs b{font-size:14px}.phs .stepn{margin:0;background:var(--line);color:var(--mut);box-shadow:none}
.phs.on{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac),0 8px 22px rgba(155,234,28,.15)}.phs.on .stepn{background:var(--ac);color:var(--ink)}
.phs.ok .stepn{background:#2f4a14;color:var(--ac)}
.view>.phcard{grid-column:1/-1}

/* ===== Anuncio propio 1.27 ===== */
.ad{background:linear-gradient(90deg,#0b0e0a,#141b10);color:var(--tx);text-align:left;padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));border-top:2px solid var(--ac);box-shadow:0 -10px 30px rgba(0,0,0,.5);z-index:5}
.adh{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px}
.adlogo{width:46px;height:34px;object-fit:contain;flex:none;filter:drop-shadow(0 0 6px rgba(155,234,28,.4))}
.adtx{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25;transition:opacity .35s,transform .35s}.adtx.out{opacity:0;transform:translateY(6px)}
.ad .adtx span{text-decoration:none;margin:0;cursor:default}
.adk{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--mut)}
.adtx b{font-family:'Exo 2',Inter,sans-serif;font-style:italic;font-size:15px;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adtx span#ad-s{font-size:12px;color:#c9d2c4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adcta{flex:none;padding:9px 16px;border-radius:10px;background:var(--ac);color:var(--ink);font:800 14px 'Exo 2',Inter,sans-serif;font-style:italic;text-decoration:none;box-shadow:0 6px 18px rgba(155,234,28,.3)}
.adcta:hover{filter:brightness(1.08)}
.adx{flex:none;font-size:11px;color:var(--mut);text-decoration:underline;cursor:pointer;margin:0!important}
@media (max-width:520px){.adx{display:none}.adtx b{font-size:13.5px;white-space:normal;line-height:1.15}.adtx span#ad-s{white-space:normal;font-size:11.5px}.adk{display:none}.adcta{padding:9px 12px}}
.modal .card{background-color:rgba(18,21,18,.97)}
.modal .stiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.modal .stile{padding:10px}.modal .stile b{font-size:19px}
.qrimg{display:block;width:100%;max-width:340px;margin:8px auto 0;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.plyrow{cursor:pointer;transition:background .15s}.plyrow:hover{background:rgba(155,234,28,.06)}
@media (min-width:1240px){.wrap{max-width:1180px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.hero{padding:22px 4px 8px}.hero h2{font-family:'Exo 2',Inter,sans-serif;font-style:italic;font-weight:800;font-size:30px;line-height:1.08;margin:0 0 10px}.hero h2 span{color:var(--ac)}.hero p{color:var(--mut);margin:0 0 16px}
.hsec{font-family:'Exo 2',Inter,sans-serif;font-style:italic;font-size:20px;margin:22px 0 12px}
.feats{display:grid;grid-auto-flow:column;grid-auto-columns:86%;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}
.feat{scroll-snap-align:start;display:flex;flex-direction:column;gap:6px;min-height:150px;padding:18px 20px;border-radius:16px;color:var(--tx);text-decoration:none;cursor:pointer;background:linear-gradient(120deg,hsl(var(--h),70%,34%),hsl(calc(var(--h) + 40),60%,12%));clip-path:polygon(18px 0,calc(100% - 18px) 0,100% 18px,100% calc(100% - 18px),calc(100% - 18px) 100%,18px 100%,0 calc(100% - 18px),0 18px);transition:transform .2s var(--ease)}
.feat:hover{transform:translateY(-3px)}.feat b{font-family:'Exo 2',Inter,sans-serif;font-style:italic;font-size:23px;line-height:1.1}.feat .small{color:rgba(255,255,255,.8)}
.ftag{align-self:flex-start;background:var(--ac);color:var(--ink);font-weight:700;font-size:12px;padding:3px 10px;border-radius:99px}.fgo{margin-top:auto;font-weight:700;color:var(--ac)}
.hbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.hbar .hsec{margin-bottom:8px}.hbar input{max-width:320px;flex:1;min-width:180px}
.gtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;margin-top:12px}
.gtile{position:relative;aspect-ratio:4/5;border-radius:14px;overflow:hidden;cursor:pointer;background:var(--card);border:1px solid var(--line);transition:transform .2s var(--ease),box-shadow .2s}
.gtile:hover,.gtile:focus-visible{transform:translateY(-4px);box-shadow:0 10px 28px rgba(155,234,28,.18);outline:none}
.gtile svg{position:absolute;inset:0;width:100%;height:100%}
.gtile .gname{position:absolute;left:10px;right:8px;bottom:28px;font-family:'Exo 2',Inter,sans-serif;font-style:italic;font-weight:800;font-size:16px;line-height:1.05;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.gtile .gcat{position:absolute;left:10px;right:8px;bottom:10px;font-size:11px;color:rgba(255,255,255,.75);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gother{background:linear-gradient(135deg,#1B201A,#070807);border-style:dashed}
@media (min-width:760px){.hero h2{font-size:42px}.feats{grid-auto-columns:calc(50% - 6px)}.gtiles{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}.gtile .gname{font-size:20px;left:12px;bottom:30px}.gtile .gcat{font-size:12px;left:12px}}
@media (min-width:1100px){.feats{grid-auto-columns:calc(33.33% - 8px)}}

/* ===== Diseño 1.23: fondo, efectos y pantalla de configuración ===== */
body{background:radial-gradient(900px 480px at 85% -10%,rgba(155,234,28,.13),transparent 60%),radial-gradient(700px 420px at -10% 10%,rgba(155,234,28,.07),transparent 60%),linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px) 0 0/100% 32px,var(--bg);background-attachment:fixed}
.card{transition:border-color .25s var(--ease),box-shadow .25s var(--ease),transform .25s var(--ease)}
.card:hover{border-color:#34402f;box-shadow:0 0 0 1px rgba(155,234,28,.06),0 14px 34px rgba(0,0,0,.35)}
.stepn{display:inline-grid;flex:none;place-items:center;width:28px;height:28px;border-radius:9px;background:var(--ac);color:var(--ink);font-family:'Exo 2',Inter,sans-serif;font-style:italic;font-weight:800;font-size:15px}
h2 .stepn{display:inline-grid;place-items:center;width:28px;height:28px;margin-right:10px;border-radius:9px;background:var(--ac);color:var(--ink);font-size:15px;font-style:normal;vertical-align:2px;box-shadow:0 0 16px rgba(155,234,28,.35)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px rgba(155,234,28,.18)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button{position:relative;overflow:hidden;transition:transform .15s var(--ease),box-shadow .25s var(--ease),filter .2s}
button:not(.sec):not(.gold):hover{box-shadow:0 8px 24px rgba(155,234,28,.32)}
button:not(.sec):not(.gold)::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-120%);transition:transform .6s var(--ease)}
button:not(.sec):not(.gold):hover::after{transform:translateX(120%)}
button:active{transform:scale(.97)}button.sec:hover{background:#2c352a}
.chip{transition:background .2s,border-color .2s,color .2s,transform .15s}.chip:hover{border-color:#4a5a43;color:var(--tx)}.chip:active{transform:scale(.96)}
.ico{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px}.ico.lock{width:14px;height:14px;margin-left:6px;color:#F5B700}.chip.on .ico.lock{color:var(--ink)}
.tab{transition:background .2s,border-color .2s,color .2s}.tab:not(.on):not(.off):hover{border-color:#4a5a43;color:var(--tx)}.tab.on{box-shadow:0 6px 22px rgba(155,234,28,.28)}
/* cabecera de configuración */
.shero{position:relative;display:flex;align-items:center;gap:18px;padding:16px;margin-bottom:14px;border-radius:18px;background:linear-gradient(120deg,#101510,#0b0e0a);border:1px solid #2a3527;overflow:hidden;isolation:isolate}
.shero::before{content:'';position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:conic-gradient(from var(--a,0deg),transparent 0 70%,var(--ac) 80%,transparent 90%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spinb 6s linear infinite;z-index:-1}
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes spinb{to{--a:360deg}}
.shero-art{flex:none;width:86px;aspect-ratio:4/5;border-radius:12px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.5)}.shero-art svg{width:100%;height:100%;display:block}
.shero-tx{min-width:0;flex:1}.shero .kicker{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ac)}
.shero h2{font-size:26px;margin:2px 0 10px;overflow-wrap:anywhere;line-height:1.1}
.hstats{display:flex;flex-wrap:wrap;gap:8px}.hstat{padding:6px 12px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.hstat b{display:block;font-family:'Exo 2',Inter,sans-serif;font-style:italic;font-size:17px;line-height:1.1}.hstat span{font-size:11px;color:var(--mut)}
.shero>.st{position:absolute;top:14px;right:14px}
@media (max-width:899px){.shero{align-items:flex-start;padding-top:46px;gap:14px}.shero-art{width:64px}.shero h2{font-size:22px;margin-bottom:8px}.hstats{display:grid;grid-template-columns:1fr 1fr;gap:6px}.hstat{padding:4px 9px;border-radius:10px;min-width:0}.hstat b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hstat b{font-size:14px}.hstat span{font-size:10px}}
/* tarjetas de formato */
.fmts{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.fmt{position:relative;display:flex;flex-direction:column;gap:4px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);cursor:pointer;transition:border-color .2s,transform .2s var(--ease),box-shadow .2s}
.fmt:hover{border-color:#4a5a43;transform:translateY(-2px)}.fmt b{font-size:14px;line-height:1.2}.fmt span{font-size:12px;color:var(--mut);line-height:1.3}
.fmt .fmti{width:30px;height:30px;color:var(--mut);margin-bottom:4px;stroke-width:1.6}
.fmt.on{border-color:var(--ac);background:linear-gradient(160deg,rgba(155,234,28,.16),rgba(155,234,28,.02));box-shadow:0 0 0 1px var(--ac),0 10px 26px rgba(155,234,28,.14)}.fmt.on .fmti{color:var(--ac)}
.fmt.on::after{content:'';position:absolute;top:10px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--ac);box-shadow:0 0 10px var(--ac)}
/* reparto en columnas */
.setup{display:flex;flex-direction:column}.scol,.duo{display:contents}
@media (max-width:899px){#tt-datos{order:1}#tt-part{order:2}#tt-reglas{order:3}#tt-publico{order:4}#tt-inscr{order:5}#tt-info{order:6}#tt-noticias{order:7}#tt-patroc{order:8}}
@media (min-width:900px){
  .setup{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr);gap:20px;align-items:start}
  .scol{display:flex;flex-direction:column;gap:18px}.scol>.card{margin:0}
  .duo{display:grid;grid-template-columns:1fr 1fr;gap:18px}.duo>.card{margin:0}
  .sside{position:sticky;top:16px}
  .shero{padding:22px 24px;gap:24px}.shero-art{width:120px}.shero h2{font-size:34px}
  #tt-part textarea{min-height:220px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
